name: Build & Release VoxForm Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Signed Debug APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configure Android SDK & Licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${SDK_DIR}" >> "$GITHUB_ENV"
          if [ -x "${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${SDK_DIR}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "${SDK_DIR}" -name sdkmanager -type f 2>/dev/null | head -n 1 || true)
          fi
          if [ -n "${SDKMANAGER}" ]; then
            echo "Using sdkmanager: ${SDKMANAGER}"
            echo "$(dirname "${SDKMANAGER}")" >> "$GITHUB_PATH"
            echo "${SDK_DIR}/platform-tools" >> "$GITHUB_PATH"
            yes | "${SDKMANAGER}" --licenses > /dev/null 2>&1 || true
            yes | "${SDKMANAGER}" --install "platform-tools" "build-tools;36.0.0" "platforms;android-36" || true
            yes | "${SDKMANAGER}" --install "platforms;android-36.1" || true
            ls -la "${SDK_DIR}/platforms" "${SDK_DIR}/build-tools" || true
          else
            echo "::warning::sdkmanager not found under ${SDK_DIR}"
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore or generate CI debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Decoded debug.keystore from debug.keystore.base64"
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback CI debug.keystore"
          fi
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f app/google-services.json ]; then
            echo "::warning::app/google-services.json not found in repository. Firebase features require app/google-services.json."
          fi

      - name: Compute version metadata
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG_NAME="${GITHUB_REF_NAME}"
            VERSION_NAME="${GITHUB_REF_NAME#v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
            TAG_NAME="v${VERSION_NAME}"
          fi
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "apk_filename=VoxForm-${TAG_NAME}.apk" >> "$GITHUB_OUTPUT"

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug \
            -Dorg.gradle.jvmargs="-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8" \
            -PVOXFORM_VERSION_CODE=${{ steps.version.outputs.version_code }} \
            -PVOXFORM_VERSION_NAME=${{ steps.version.outputs.version_name }} \
            -PVOXFORM_GITHUB_REPO=${{ github.repository }} \
            --no-daemon \
            --no-configuration-cache \
            --stacktrace 2>&1 | tee gradle-build.log

      - name: Report Gradle error in Summary (on failure)
        if: failure()
        shell: bash
        run: |
          if [ -f gradle-build.log ]; then
            SUMMARY_ERR=$(grep -E "(^FAILURE:|^\* What went wrong:|> Task .* FAILED|^e: |Caused by:|Execution failed for task)" gradle-build.log | head -n 15 | tr '\n' ' ')
            if [ -n "$SUMMARY_ERR" ]; then
              echo "::error title=Gradle Build Failure::${SUMMARY_ERR}"
            fi
            {
              echo "### ❌ Erro no Build Android APK"
              echo '```text'
              grep -n -C 2 -E "(^FAILURE:|^\* What went wrong:|> Task .* FAILED|^e: |Caused by:|Execution failed for task)" gradle-build.log | head -n 80 || true
              echo "--- Ultimas 40 linhas do log ---"
              tail -n 40 gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Prepare versioned and latest APK assets
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${{ steps.version.outputs.apk_filename }}"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/VoxForm-latest.apk"
          ls -lh dist/

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.apk_filename }}
          path: dist/${{ steps.version.outputs.apk_filename }}
          retention-days: 30

      - name: Publish GitHub Release with APK (for in-app Atualizar button)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag_name }}
          name: "VoxForm ${{ steps.version.outputs.tag_name }}"
          generate_release_notes: true
          make_latest: true
          files: |
            dist/${{ steps.version.outputs.apk_filename }}
            dist/VoxForm-latest.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish APK Download Link in Summary
        if: success()
        shell: bash
        run: |
          {
            echo "### ✅ VoxForm APK pronto para baixar"
            echo ""
            echo "- **Link direto (sempre a versão mais recente):** https://github.com/${{ github.repository }}/releases/latest/download/VoxForm-latest.apk"
            echo "- **Versão deste build (${{ steps.version.outputs.tag_name }}):** https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag_name }}/${{ steps.version.outputs.apk_filename }}"
          } >> "$GITHUB_STEP_SUMMARY"
